syntax = "proto3";

package inferoxa.v1;

import "reasoning.proto";

import "google/protobuf/timestamp.proto";

//
// types
//

// A single message in a chat conversation.
// The role of the message is determined by which field is set.
message ChatMessage {
    oneof message {
        // Instructions for the model.
        ChatSystemMessage system = 1;
        // A message generated by the model.
        ChatAssistantMessage assistant = 2;
        // A message sent by the end user.
        ChatUserMessage user = 3;
        // Results of tool calls requested by the model.
        ChatToolMessage tool = 4;
    }
}

// A message generated by the model.
message ChatAssistantMessage {
    // Contents of the message, in the order they were generated.
    // A single message may mix text, tool calls and reasoning.
    repeated ChatAssistantContent contents = 1;
}

// One part of an assistant message.
message ChatAssistantContent {
    oneof content {
        // Text generated by the model.
        ChatTextContent text = 1;
        // A request from the model to call a tool.
        ChatToolCallContent tool_call = 2;
        // Reasoning produced by the model before its answer.
        ChatReasoningContent reasoning = 3;
    }
}

// A message sent by the end user.
message ChatUserMessage {
    // Name of the participant who sent this message.
    // Used to distinguish between multiple users in the same conversation.
    optional string name = 1;
    // Contents of the message, in order.
    repeated ChatUserContent contents = 2;
}

// One part of a user message.
message ChatUserContent {
    oneof content {
        // Text input.
        ChatTextContent text = 1;
        // File input, such as an image or a document.
        ChatFileContent file = 2;
    }
}

// A message that returns the results of tool calls to the model.
message ChatToolMessage {
    // Results of the tool calls.
    // Each result corresponds to one ChatToolCallContent of a preceding assistant message.
    repeated ChatToolResultContent tool_results = 1;
}

// A message that gives instructions to the model.
message ChatSystemMessage {
    // Contents of the message, in order.
    repeated ChatTextContent contents = 1;
}

// A text content.
message ChatTextContent {
    // The text.
    string text = 1;
}

// Reasoning produced by the model before its answer.
message ChatReasoningContent {
    // Raw reasoning texts.
    // Empty if the provider does not expose raw reasoning.
    repeated string texts = 1;
    // Summaries of the reasoning.
    // Empty if the provider does not generate summaries.
    repeated string summaries = 2;
}

// A file content. The file can be given in one of several ways.
message ChatFileContent {
    oneof file {
        // File data embedded in the request.
        ChatFileContentRawData raw = 1;
        // Reference to a previously uploaded file.
        ChatFileContentId id = 2;
        // Reference to a file by URL.
        ChatFileContentUrl url = 3;
    }
}

// A file whose data is embedded in the request.
message ChatFileContentRawData {
    // File name.
    string name = 1;
    // Raw bytes of the file.
    bytes content = 2;
    // MIME type of the file. e.g. "image/png"
    string mime_type = 3;
}

// A reference to a previously uploaded file.
message ChatFileContentId {
    // ID of the file issued by the Files API.
    // The Files API is not available yet. This field is reserved for future use.
    string id = 1;
}

// A reference to a file by URL.
message ChatFileContentUrl {
    // URL of the file.
    string url = 1;
}

// A request from the model to call a tool.
message ChatToolCallContent {
    // ID of this tool call.
    // The result must be returned with the same ID in ChatToolResultContent.tool_call_id.
    string id = 1;
    // Name of the tool to call. Matches ChatTool.name.
    string name = 2;
    // Arguments of the call, as a JSON-encoded object.
    // The model may generate invalid JSON or arguments that do not match the schema.
    string arguments = 3;
}

// The result of a single tool call.
message ChatToolResultContent {
    // ID of the tool call this result belongs to. Matches ChatToolCallContent.id.
    string tool_call_id = 1;
    // Contents of the result, in order.
    repeated ChatToolResultPart contents = 2;
}

// One part of a tool result.
message ChatToolResultPart {
    oneof content {
        // Text output of the tool.
        ChatTextContent text = 1;
        // File output of the tool, such as an image.
        ChatFileContent file = 2;
    }
}

// Definition of a tool that the model may call.
message ChatTool {
    // Name of the tool. Must be unique within a request.
    string name = 1;
    // Description of what the tool does.
    // The model uses this to decide when and how to call the tool.
    string description = 2;
    // JSON Schema of the tool arguments, as a JSON-encoded object.
    // If this field is unspecified, the tool takes no arguments.
    optional string parameters_json_schema = 3;
}

// Controls which tool the model calls.
message ChatToolChoice {
    oneof choice {
        // Let the model choose according to the mode.
        ChatToolChoiceMode mode = 1;
        // Force the model to call the tool with this name. Matches ChatTool.name.
        string tool_name = 2;
    }
}

message ChatReasoningOptions {
    ChatReasoningEffort effort = 1;
}

// delta

// An incremental update of the assistant message in a streamed chat completion.
// The complete ChatAssistantMessage is built by applying all deltas in order.
message ChatMessageDelta {
    // Index in ChatAssistantMessage.contents of the content this delta applies to.
    // A delta with a new index starts a new content.
    uint32 content_index = 1;
    oneof content_delta {
        // Text to append to a ChatTextContent.
        CompletionTextDelta text = 2;
        // Update of a ChatToolCallContent.
        ChatToolCallContentDelta tool_call = 3;
        // Update of a ChatReasoningContent.
        ChatReasoningContentDelta reasoning = 4;
    }
}

// The final event of a streamed completion.
message CompletionFinished {
    // The reason why the generation stopped.
    CompletionFinishReason reason = 1;
    // The usage information for the request.
    CompletionUsage usage = 2;
}

// An incremental update of a tool call.
message ChatToolCallContentDelta {
    // ID of the tool call. Set in the first delta of the tool call.
    optional string id = 1;
    // Name of the tool to call. Set in the first delta of the tool call.
    optional string name = 2;

    // Fragment to append to ChatToolCallContent.arguments.
    // A single fragment is not necessarily valid JSON.
    string arguments_delta = 3;
}

// An incremental update of generated text.
message CompletionTextDelta {
    // Text fragment to append.
    string text = 1;
}

// An incremental update of a reasoning content.
message ChatReasoningContentDelta {
    // Text fragment. How this is applied depends on the type.
    string text = 1;
    // The kind of this update.
    ChatReasoningDeltaType type = 2;
}

// The kind of a reasoning update.
enum ChatReasoningDeltaType {
    CHAT_REASONING_DELTA_TYPE_UNSPECIFIED = 0;
    // Starts a new element of ChatReasoningContent.summaries.
    // The text is either empty or the first fragment of the new element.
    CHAT_REASONING_DELTA_TYPE_SUMMARY_ADDED = 1;
    // Appends the text to the last element of ChatReasoningContent.summaries.
    CHAT_REASONING_DELTA_TYPE_SUMMARY_TEXT_DELTA = 2;
    // Starts a new element of ChatReasoningContent.texts.
    // The text is either empty or the first fragment of the new element.
    CHAT_REASONING_DELTA_TYPE_REASONING_ADDED = 3;
    // Appends the text to the last element of ChatReasoningContent.texts.
    CHAT_REASONING_DELTA_TYPE_REASONING_TEXT_DELTA = 4;
}

// misc

// Generation options shared by chat and text completions.
// If a field is unspecified, the default of the provider or the model is used.
message CompletionOptions {
    // Maximum number of tokens to generate, including reasoning tokens.
    // When the limit is reached, the generation stops with COMPLETION_FINISH_REASON_LENGTH.
    optional uint64 max_completion_tokens = 1;
    // Maximum number of prompt tokens.
    // If the prompt exceeds this limit, the API returns INVALID_ARGUMENT without generating.
    // If the provider does not support this option, it returns INVALID_ARGUMENT.
    optional uint64 max_prompt_tokens = 2;
    // Seed for sampling. The same seed and request make the output more reproducible.
    // If the provider does not support this option, it returns INVALID_ARGUMENT.
    optional uint64 seed = 3;
    // Penalizes tokens in proportion to how often they have already appeared.
    // Positive values reduce repetition.
    optional float frequency_penalty = 4;
    // Penalizes tokens that have already appeared at least once.
    // Positive values encourage new topics.
    optional float presence_penalty = 5;
    // Sampling temperature. Higher values make the output more random.
    optional float temperature = 6;
    // Nucleus sampling. Only the most likely tokens whose cumulative probability
    // reaches this value are considered.
    optional float top_p = 7;
    // Size of the context window to use for this request, in tokens.
    // This is the total of prompt and completion tokens.
    // If the provider does not support this option, it returns INVALID_ARGUMENT.
    optional uint64 context_length = 8;
    // Sequences that stop the generation when generated.
    // The matched sequence is not included in the output.
    repeated string stop_sequences = 9;
}

// The reason why the generation stopped.
enum CompletionFinishReason {
    COMPLETION_FINISH_REASON_UNSPECIFIED = 0;
    // The model finished naturally or generated a stop sequence.
    COMPLETION_FINISH_REASON_STOP = 1;
    // max_completion_tokens or the context window was exhausted.
    COMPLETION_FINISH_REASON_LENGTH = 2;
    // The model requested one or more tool calls.
    COMPLETION_FINISH_REASON_TOOL_CALL = 3;
    // The output was blocked by a content filter.
    COMPLETION_FINISH_REASON_CONTENT_FILTER = 4;
}

// How the model chooses whether to call tools.
enum ChatToolChoiceMode {
    CHAT_TOOL_CHOICE_MODE_UNSPECIFIED = 0;
    // The model decides whether to call tools.
    CHAT_TOOL_CHOICE_MODE_AUTO = 1;
    // The model must not call any tool.
    CHAT_TOOL_CHOICE_MODE_NONE = 2;
    // The model must call at least one tool.
    CHAT_TOOL_CHOICE_MODE_REQUIRED = 3;
}

// Token usage of a completion request.
message CompletionUsage {
    // Number of completion tokens (a.k.a. output tokens) include reasoning tokens.
    uint64 completion_tokens = 1;
    // Number of prompt tokens (a.k.a. input tokens) include cached tokens.
    uint64 prompt_tokens = 2;
    // Number of reasoning tokens.
    // Unspecified if the provider does not report it.
    optional uint64 completion_reasoning_tokens = 3;
    // Number of cached prompt tokens.
    // Unspecified if the provider does not report it.
    optional uint64 prompt_cached_tokens = 4;
}

//
// Request / Response
//

message CreateChatCompletionRequest {
    // ID of the model to use.
    string model = 1;
    // The conversation so far, in chronological order.
    repeated ChatMessage messages = 2;
    // Tools the model may call.
    repeated ChatTool tools = 3;
    // Controls which tool the model calls.
    // If this field is unspecified, the model decides whether to call tools.
    ChatToolChoice tool_choice = 4;
    // Generation options.
    CompletionOptions options = 5;
    ChatReasoningOptions reasoning_options = 6;
}

message CreateChatCompletionResponse {
    // ID of this completion.
    string id = 1;
    // The message generated by the model.
    ChatAssistantMessage message = 2;
    // The reason why the generation stopped.
    CompletionFinishReason finish_reason = 3;
    // The usage information for the request.
    CompletionUsage usage = 4;
    // The time when this completion was created.
    google.protobuf.Timestamp created = 5;
}

// One event of a streamed chat completion.
message CreateChatCompletionStreamResponse {
    // ID of this completion. The same for all events of a stream.
    string id = 1;
    oneof event {
        // An incremental update of the assistant message.
        ChatMessageDelta delta = 2;
        // The generation has finished. This is the last event of the stream.
        CompletionFinished finished = 3;
    }
    // The time when this completion was created. The same for all events of a stream.
    google.protobuf.Timestamp created = 4;
}

message CreateTextCompletionRequest {
    // ID of the model to use.
    string model = 1;
    // The prompt to complete. No chat template is applied.
    string prompt = 2;
    // Generation options.
    CompletionOptions options = 3;
}

message CreateTextCompletionResponse {
    // ID of this completion.
    string id = 1;
    // The generated text. The prompt is not included.
    string text = 2;
    // The reason why the generation stopped.
    CompletionFinishReason finish_reason = 3;
    // The usage information for the request.
    CompletionUsage usage = 4;
    // The time when this completion was created.
    google.protobuf.Timestamp created = 5;
}

// One event of a streamed text completion.
message CreateTextCompletionStreamResponse {
    // ID of this completion. The same for all events of a stream.
    string id = 1;
    oneof event {
        // Text fragment to append to the generated text.
        CompletionTextDelta text = 2;
        // The generation has finished. This is the last event of the stream.
        CompletionFinished finished = 3;
    }
    // The time when this completion was created. The same for all events of a stream.
    google.protobuf.Timestamp created = 4;
}

//
// Service
//

service CompletionsService {
    // Generate the next assistant message of a chat conversation.
    rpc CreateChatCompletion(CreateChatCompletionRequest) returns (CreateChatCompletionResponse);
    // Same as CreateChatCompletion, but the message is returned incrementally as it is generated.
    rpc CreateChatCompletionStream(CreateChatCompletionRequest) returns (stream CreateChatCompletionStreamResponse);

    // Generate the continuation of a raw text prompt.
    rpc CreateTextCompletion(CreateTextCompletionRequest) returns (CreateTextCompletionResponse);
    // Same as CreateTextCompletion, but the text is returned incrementally as it is generated.
    rpc CreateTextCompletionStream(CreateTextCompletionRequest) returns (stream CreateTextCompletionStreamResponse);
}
